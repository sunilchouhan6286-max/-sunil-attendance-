<!DOCTYPE html>
<html>
<head>
  <title>Sunil's Attendance Sheet – October 2025</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f9f9f9; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #999; padding: 8px; text-align: center; }
    th { background-color: #dfe6e9; }
    select { padding: 4px; }
    h2 { text-align: center; }
  </style>
</head>
<body>
  <h2>Attendance Sheet – October 2025</h2>
  <table>
    <tr>
      <th>Date</th>
      <th>10–12<br>English G/Vocab</th>
      <th>12–2<br>GS (Polity/Geo)</th>
      <th>2:30–5<br>Adv. Maths</th>
      <th>8–10 PM<br>Reasoning</th>
      <th>10–12 PM<br>Computer/Static GK</th>
      <th>Remarks</th>
    </tr>
    <script>
      for (let i = 1; i <= 31; i++) {
        document.write(`<tr>
          <td>Oct ${i}, 2025</td>
          <td><select><option value="">--</option><option>Yes</option><option>No</option></select></td>
          <td><select><option value="">--</option><option>Yes</option><option>No</option></select></td>
          <td><select><option value="">--</option><option>Yes</option><option>No</option></select></td>
          <td><select><option value="">--</option><option>Yes</option><option>No</option></select></td>
          <td><select><option value="">--</option><option>Yes</option><option>No</option></select></td>
          <td contenteditable></td>
        </tr>`);
      }
    </script>
  </table>

  <script>
    Notification.requestPermission().then(function(permission) {
      if (permission === "granted") {
        setInterval(function() {
          let now = new Date();
          let hour = now.getHours();
          let minute = now.getMinutes();

          if (hour === 10 && minute === 0) {
            new Notification("🕙 Time to mark English G/Vocab (10–12)");
          }
          if (hour === 12 && minute === 0) {
            new Notification("🕛 Time to mark GS (12–2)");
          }
          if (hour === 14 && minute === 30) {
            new Notification("🕝 Time to mark Adv. Maths (2:30–5)");
          }
          if (hour === 20 && minute === 0) {
            new Notification("🕗 Time to mark Reasoning (8–10 PM)");
          }
          if (hour === 22 && minute === 0) {
            new Notification("🕙 Time to mark Computer/Static GK (10–12 PM)");
          }
        }, 60000); // check every minute
      }
    });
  </script>
</body>

</html>
